name: Android E2E

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumentation:
    name: Instrumentation tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew
      - name: Run deterministic E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          script: >-
            ./gradlew :app:connectedDebugAndroidTest
            -Pandroid.testInstrumentationRunnerArguments.class=com.gabedev.mangako.e2e.LibraryJourneyTest
      - name: Collect diagnostic artifacts
        if: failure()
        run: |
          adb logcat -d > app/build/reports/logcat.txt || true
          adb shell screencap -p /sdcard/e2e-failure.png || true
          adb pull /sdcard/e2e-failure.png app/build/reports/e2e-failure.png || true
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-e2e-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/reports/logcat.txt
            app/build/reports/e2e-failure.png
          if-no-files-found: ignore
